[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kazenai-finops"
version = "1.1.3"
description = "KazenAI customer SDK: stop AI agent overspend before the call — budgets, loop detection and spend attribution for OpenAI and Anthropic"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Dhavan Shah", email = "founder@kazenai.com" }]
keywords = ["llm", "agent", "finops", "observability", "openai", "anthropic", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

# Customer-facing entry point. Re-exports from kazenai-core so existing
# user code (`from kazenai_finops import monitor`) routes to the engine.
# The dependency is pinned to a minor range so transitive upgrades land
# in `pip install --upgrade` automatically while protecting against
# breaking changes (next major bump = next coordinated release).
dependencies = [
    "kazenai>=1.1.3,<2.0",
    "kazen-event-schema>=0.6.4,<0.7",
    "pydantic>=2.0,<3",
    "httpx>=0.25,<1",
]

[project.optional-dependencies]
openai = ["openai>=1.40,<3"]
anthropic = ["anthropic>=0.39,<1"]
providers = ["openai>=1.40,<3", "anthropic>=0.39,<1"]
langchain = [
    "langchain==1.4.4",
    "langchain-core==1.6.9",
    "langchain-openai==1.7.0",
    "langchain-anthropic==1.7.5",
]
langgraph = [
    "langgraph==1.2.14",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain-core==1.6.9",
]
crewai = ["crewai==1.15.26"]
# Convenience: every supported framework adapter.
all = [
    "langchain==1.4.4",
    "langchain-core==1.6.9",
    "langchain-openai==1.7.0",
    "langchain-anthropic==1.7.5",
    "langgraph==1.2.14",
    "langgraph-checkpoint-sqlite==3.1.1",
    "crewai==1.15.26",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "fastapi>=0.115",
    "starlette>=0.40",
    "flask>=3.0",
    "django>=5.0",
    "httpx>=0.28",
    "openai>=1.40,<3",
    "anthropic>=0.39,<1",
]

[project.urls]
Homepage = "https://kazenai.com"
Documentation = "https://docs.kazenai.com/"
Repository = "https://github.com/kazenai-ai/kazenai-finops-sdk"
Changelog = "https://github.com/kazenai-ai/kazenai-finops-sdk/releases"
"Bug Tracker" = "https://github.com/kazenai-ai/kazenai-finops-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["kazenai_finops*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
