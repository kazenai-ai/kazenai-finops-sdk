name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install vendored unpublished deps
        run: |
          pip install --upgrade pip
          # schema first: kazenai wheel depends on kazen-event-schema
          pip install ./vendor/kazen_event_schema-0.6.0-py3-none-any.whl
          pip install ./vendor/kazenai-1.0.1-py3-none-any.whl

      - run: |
          pip install -e ".[dev]"
          pytest tests/ -q --cov=kazenai_finops --cov-report=term-missing
