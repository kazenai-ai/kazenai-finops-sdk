name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install schema dependency
        run: |
          pip install --upgrade pip
          pip install ./vendor/kazen_event_schema-0.6.3-py3-none-any.whl

      - run: |
          # Coordinated release order: kazenai 1.1.x must be public first.
          pip install -e ".[dev]"
          ruff check kazenai_finops/__init__.py tests/test_package_smoke.py
          mypy kazenai_finops/__init__.py --ignore-missing-imports
          pytest tests/ -q --cov=kazenai_finops --cov-report=term-missing
